spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/auth/login,/auth/refresh,/.well-known/jwks.json

            - id: user-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/users/**,/payment-cards/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL}
              predicates:
                - Path=/orders/**,/items/**