spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/auth/login,/auth/refresh

            - id: user-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/users/**,/payment-cards/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL}
              predicates:
                - Path=/orders/**,/items/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true